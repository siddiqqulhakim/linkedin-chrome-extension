<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span { font-size: 20px; }

    .status {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .status-row:last-child { margin-bottom: 0; }

    .label { font-size: 12px; color: #888; }
    .value { font-size: 14px; font-weight: 600; color: #fff; }
    .value.running { color: #4ade80; }
    .value.stopped { color: #f87171; }

    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-start { background: #4ade80; color: #0a0a0a; }
    .btn-stop { background: #f87171; color: #fff; }
    .btn-secondary { background: #2a2a4a; color: #e0e0e0; font-size: 12px; padding: 7px; }

    .instructions {
      margin-top: 12px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }

    .instructions strong { color: #888; }
  </style>
</head>
<body>
  <h1><span>🔗</span> LinkedIn Auto Connect</h1>

  <div class="status">
    <div class="status-row">
      <span class="label">Status</span>
      <span class="value stopped" id="statusValue">Stopped</span>
    </div>
    <div class="status-row">
      <span class="label">Sent</span>
      <span class="value" id="sentValue">0</span>
    </div>
    <div class="status-row">
      <span class="label">Page</span>
      <span class="value" id="pageValue">—</span>
    </div>
    <div class="status-row">
      <span class="label">Last action</span>
      <span class="value" id="logValue" style="font-size:11px;color:#888">—</span>
    </div>
  </div>

  <button class="btn btn-start" id="btnStart">▶ Start</button>
  <button class="btn btn-stop" id="btnStop" style="display:none">■ Stop</button>
  <button class="btn btn-secondary" id="btnReset">Reset counter</button>

  <div class="instructions">
    <strong>How to use:</strong><br>
    1. Open LinkedIn Invitations page<br>
    2. Click Start to begin automation<br>
    3. It auto-advances through all pages<br>
    4. Click Stop to pause anytime
  </div>

  <script src="popup.js"></script>
</body>
</html>
